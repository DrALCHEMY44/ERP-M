name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, API and security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mobile:
    name: Flutter host checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release-hygiene:
    name: Release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject committed local secrets and generated reports
        shell: bash
        run: |
          tracked_release_artifacts="$(git ls-files | rg '(^|/)(\.env($|\.)|key\.properties$|.*\.(jks|keystore)$|playwright-report/|test-results/)' | rg -v '^frontend/\.env\.example$' || true)"
          if [[ -n "$tracked_release_artifacts" ]]; then
            printf '%s\n' "$tracked_release_artifacts"
            echo '::error::A local secret or generated test artifact is tracked.'
            exit 1
          fi
      - run: git diff --check "${{ github.event.before }}" HEAD
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      - run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
        if: github.event_name == 'pull_request'
