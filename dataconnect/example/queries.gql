# -----------------------------------
# Tenant & User Queries
# -----------------------------------
query ListTenants @auth(level: USER, insecureReason: "Multi-tenant ERP") {
  tenants {
    id
    name
    businessSector
    location
    ownerEmail
    taxId
    logoUrl
    subscriptionTier
    status
    createdAt
  }
}

query ListUsers @auth(level: USER, insecureReason: "Multi-tenant ERP") {
  users {
    id
  }
}

query ListBusinesses($tenantId: String!)
@auth(level: USER, insecureReason: "Multi-tenant ERP") {
  businesses(where: { tenantId: { eq: $tenantId } }) {
    id
    name
    location
  }
}

query getUserByEmail($email: String!)
@auth(level: PUBLIC, insecureReason: "Auth lookup before login") {
  users(where: { email: { eq: $email } }) {
    id
    email
    role
    department
    phoneNumber
    createdAt
    tenantId
    businessId
    fullName
  }
}

query getBusinessById($id: String!)
@auth(level: PUBLIC, insecureReason: "Auth lookup during login") {
  business(id: $id) {
    id
    tenantId
    name
    createdAt
    code
  }
}

query getBusinessByCode($code: String!)
@auth(level: PUBLIC, insecureReason: "Auth lookup before login") {
  businesses(where: { code: { eq: $code } }) {
    id
    tenantId
    name
  }
}

query verifyUserLogin(
  $email: String!
  $fullName: String!
  $role: String!
  $accessCode: String!
  $tenantId: String!
  $businessId: String!
) @auth(level: PUBLIC, insecureReason: "Auth verification during login") {
  users(
    where: {
      email: { eq: $email }
      fullName: { eq: $fullName }
      role: { eq: $role }
      accessCode: { eq: $accessCode }
      tenantId: { eq: $tenantId }
      businessId: { eq: $businessId }
    }
  ) {
    id
    email
    role
    fullName
    tenantId
    businessId
  }
}



# -----------------------------------
# Business Data Queries
# -----------------------------------
query listProductsByBusiness($tenantId: String!, $businessId: String!)
@auth(level: PUBLIC, insecureReason: "Allowed for server-side assistant context querying") {
  products(
    where: { tenantId: { eq: $tenantId }, businessId: { eq: $businessId } }
  ) {
    id
    name
    category
    quantity
    costPrice
    sellingPrice
    expiryDate
    lowStockLevel
    createdBy
    createdAt
    updatedAt
    tenantId
    businessId
  }
}

