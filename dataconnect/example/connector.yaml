connectorId: example
generate:
  javascriptSdk:
    - outputDir: ..\..\src\dataconnect-generated
      package: "@dataconnect/generated"
      packageJsonDir: ..\..
      react: true
      angular: false
      clientCache: {}
  dartSdk:
    - outputDir: ../../erp_mobile/lib/generated
      package: dataconnect_generated
      packageJsonDir: ../../erp_mobile
      clientCache: {}
  flutterSdk:
    - outputDir: ../../erp_mobile/lib/generated_sdk
      package: dataconnect_generated_sdk
