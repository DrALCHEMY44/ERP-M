enum TransactionType {
  SALE
  EXPENSE
}

enum TaskStatus {
  PENDING
  ONGOING
  COMPLETED
  LATE
}

enum TaskPriority {
  LOW
  MEDIUM
  HIGH
}

type Tenant @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  name: String!
  businessSector: String!
  location: String!
  ownerEmail: String!
  taxId: String
  logoUrl: String
  subscriptionTier: String
  status: String
  createdAt: Timestamp!
}

type User @table(key: "id") {
  id: String! @default(expr: "auth.uid")
  tenantId: String!
  businessId: String!
  email: String!
  role: String!
  fullName: String
  department: String
  phoneNumber: String
  createdAt: Timestamp!
  accessCodeHash: String
  # Transitional only: backfill script hashes and clears this value before the
  # column is removed in a later schema deployment.
  accessCode: String
}

type Business @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  name: String!
  location: String!
  businessType: String
  entityType: String
  city: String
  region: String
  phone: String
  email: String
  taxId: String
  description: String
  logoUrl: String
  createdAt: Timestamp!
  code: String!
}

type BusinessSetting @table(key: "businessId") {
  businessId: String!
  tenantId: String!
  currency: String!
  timezone: String!
  fiscalYearStart: String!
  taxRate: Float! @col(dataType: "numeric(7,4)")
  lowStockThreshold: Int!
  updatedAt: Timestamp!
}

type Product @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  name: String!
  category: String
  quantity: Int!
  costPrice: Float @col(dataType: "numeric(19,2)")
  sellingPrice: Float! @col(dataType: "numeric(19,2)")
  expiryDate: Date
  lowStockLevel: Int
  status: String
  createdBy: String!
  createdAt: Timestamp!
  updatedAt: Timestamp
}

type Transaction @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  type: TransactionType! # 💡 Linked to your TransactionType Enum
  amount: Float! @col(dataType: "numeric(19,2)")
  date: Timestamp!
  category: String
  description: String
  receiptUrl: String
  recordedBy: String!
  createdAt: Timestamp!
}

type Task @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  title: String!
  description: String
  status: TaskStatus! # 💡 Linked to your TaskStatus Enum
  priority: TaskPriority # 💡 Linked to your TaskPriority Enum
  dueDate: Timestamp!
  assignedTo: User
  createdBy: String!
  createdAt: Timestamp!
  updatedAt: Timestamp
}

type TaskComment @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  task: Task!
  user: User!
  content: String!
  createdAt: Timestamp!
}

type Employee @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  fullName: String!
  position: String!
  role: String
  salary: Float @col(dataType: "numeric(19,2)")
  department: String
  email: String
  contact: String
  startDate: Date
  status: String
  attendance: Float
  salaryPaymentStatus: String
  createdAt: Timestamp!
  code: String
}

type Customer @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  customerName: String!
  phoneNumber: String
  email: String
  location: String
  totalOrders: Int
  totalSpent: Float @col(dataType: "numeric(19,2)")
  notes: String
  createdAt: Timestamp!
}

type Supplier @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  supplierName: String!
  phoneNumber: String
  email: String
  location: String
  productsSupplied: String
  paymentStatus: String
  notes: String
  createdAt: Timestamp!
}

type Document @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  title: String!
  documentType: String!
  fileUrl: String!
  description: String
  uploadedBy: String!
  uploadedAt: Timestamp!
}

type ActivityLog @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  userId: String!
  userName: String!
  actionType: String!
  module: String!
  description: String
  recordId: String
  timestamp: Timestamp!
}

type AiQuery @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  userId: String!
  queryText: String!
  response: String
  timestamp: Timestamp!
}

type Notification @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  userId: String!
  message: String!
  isRead: Boolean!
  createdAt: Timestamp!
}

type MirrorOutbox @table(key: "id") {
  id: String! @default(expr: "uuidV4()")
  tenantId: String!
  businessId: String!
  entityType: String!
  operation: String!
  recordId: String!
  payload: Any!
  status: String!
  attempts: Int!
  nextAttemptAt: Timestamp!
  lastError: String
  createdAt: Timestamp!
  deliveredAt: Timestamp
}
