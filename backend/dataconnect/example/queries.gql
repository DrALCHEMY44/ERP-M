query listProductsByBusiness($tenantId: String!, $businessId: String!)
@auth(level: NO_ACCESS) {
  products(
    where: { tenantId: { eq: $tenantId }, businessId: { eq: $businessId } }
  ) {
    id
    name
    category
    quantity
    costPrice
    sellingPrice
    expiryDate
    lowStockLevel
    status
    createdBy
    createdAt
    updatedAt
    tenantId
    businessId
  }
}

query listCustomersByBusiness($tenantId: String!, $businessId: String!)
@auth(level: NO_ACCESS) {
  customers(
    where: { tenantId: { eq: $tenantId }, businessId: { eq: $businessId } }
  ) {
    id
    customerName
    phoneNumber
    email
    location
    totalOrders
    totalSpent
    notes
    createdAt
    tenantId
    businessId
  }
}

query getCustomerForCompany($id: String!, $tenantId: String!, $businessId: String!)
@auth(level: NO_ACCESS) {
  customer(first: {
    where: {
      id: { eq: $id }
      tenantId: { eq: $tenantId }
      businessId: { eq: $businessId }
    }
  }) {
    id
  }
}

