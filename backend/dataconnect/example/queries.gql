# -----------------------------------
# Tenant & User Queries
# -----------------------------------
query ListTenants @auth(level: NO_ACCESS) {
  tenants {
    id
    name
    businessSector
    location
    ownerEmail
    taxId
    logoUrl
    subscriptionTier
    status
    createdAt
  }
}

query ListUsers @auth(level: NO_ACCESS) {
  users {
    id
  }
}

query ListLegacyAccessCodes @auth(level: NO_ACCESS) {
  users(where: { accessCode: { isNull: false } }) {
    id
    accessCode
  }
}

query ListBusinesses($tenantId: String!)
@auth(level: NO_ACCESS) {
  businesses(where: { tenantId: { eq: $tenantId } }) {
    id
    name
    location
  }
}

query getUserByEmail($email: String!)
@auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email } }) {
    id
    email
    role
    department
    phoneNumber
    createdAt
    tenantId
    businessId
    fullName
  }
}

query getBusinessById($id: String!)
@auth(level: NO_ACCESS) {
  business(id: $id) {
    id
    tenantId
    name
    location
    businessType
    entityType
    city
    region
    phone
    email
    taxId
    description
    logoUrl
    createdAt
    code
  }
}

query getBusinessSettings($tenantId: String!, $businessId: String!)
@auth(level: NO_ACCESS) {
  businessSettings(
    where: { tenantId: { eq: $tenantId }, businessId: { eq: $businessId } }
    limit: 1
  ) {
    businessId
    tenantId
    currency
    timezone
    fiscalYearStart
    taxRate
    lowStockThreshold
    updatedAt
  }
}

query getBusinessByCode($code: String!)
@auth(level: NO_ACCESS) {
  businesses(where: { code: { eq: $code } }) {
    id
    tenantId
    name
  }
}

query getBusinessesByName($name: String!)
@auth(level: NO_ACCESS) {
  businesses(where: { name: { eq: $name } }) {
    id
    tenantId
    name
    code
  }
}

query verifyEmployeeAccess(
  $fullName: String!
  $role: String!
  $accessCodeHash: String!
  $tenantId: String!
  $businessId: String!
) @auth(level: NO_ACCESS) {
  users(
    where: {
      fullName: { eq: $fullName }
      role: { eq: $role }
      accessCodeHash: { eq: $accessCodeHash }
      tenantId: { eq: $tenantId }
      businessId: { eq: $businessId }
    }
  ) {
    id
    email
    role
    fullName
    tenantId
    businessId
  }
}

query verifyUserLogin(
  $email: String!
  $fullName: String!
  $role: String!
  $accessCodeHash: String!
  $tenantId: String!
  $businessId: String!
) @auth(level: NO_ACCESS) {
  users(
    where: {
      email: { eq: $email }
      fullName: { eq: $fullName }
      role: { eq: $role }
      accessCodeHash: { eq: $accessCodeHash }
      tenantId: { eq: $tenantId }
      businessId: { eq: $businessId }
    }
  ) {
    id
    email
    role
    fullName
    tenantId
    businessId
  }
}



# -----------------------------------
