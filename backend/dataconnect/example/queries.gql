}

query listNotifications($tenantId: String!, $businessId: String!, $userId: String!)
@auth(level: NO_ACCESS) {
  notifications(
    where: { tenantId: { eq: $tenantId }, businessId: { eq: $businessId }, userId: { eq: $userId } }
  ) {
    id
