}

query ListPendingMirrorOutbox @auth(level: NO_ACCESS) {
  mirrorOutboxes(where: { status: { in: ["PENDING", "FAILED"] } }, orderBy: [{ nextAttemptAt: ASC }], limit: 100) {
    id tenantId businessId entityType operation recordId payload status attempts nextAttemptAt lastError createdAt
  }
}
