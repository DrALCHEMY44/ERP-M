mutation CompleteAssignedTask(
  $taskId: String!
  $userId: String!
  $tenantId: String!
  $businessId: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    user(id: $userId) @check(expr: "this != null", message: "Employee account not found") {
      id
      tenantId @check(expr: "this == vars.tenantId", message: "Employee is outside this company")
      businessId @check(expr: "this == vars.businessId", message: "Employee is outside this company")
    }
    task(id: $taskId) @check(expr: "this != null", message: "Task not found") {
      tenantId @check(expr: "this == vars.tenantId", message: "Task is outside this company")
      businessId @check(expr: "this == vars.businessId", message: "Task is outside this company")
      assignedTo {
        id @check(expr: "this == vars.userId", message: "Task is not assigned to this employee")
      }
    }
  }
  task_update(id: $taskId, data: {
    status: COMPLETED
    updatedAt_expr: "request.time"
  })
}

