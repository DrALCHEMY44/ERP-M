mutation UpdateEmployeeWithAccess(
  $id: String!
  $tenantId: String!
  $businessId: String!
  $currentEmail: String!
  $fullName: String!
  $position: String!
  $role: String
  $userRole: String!
  $salary: Float
  $department: String
  $email: String!
  $contact: String
  $startDate: Date
  $status: String
  $attendance: Float
  $salaryPaymentStatus: String
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employee(id: $id) @check(expr: "this != null", message: "Employee not found") {
      tenantId @check(expr: "this == vars.tenantId", message: "Employee is outside this company")
      businessId @check(expr: "this == vars.businessId", message: "Employee is outside this company")
      email @check(expr: "this == vars.currentEmail", message: "Employee login binding changed")
    }
  }
  employee_update(id: $id, data: {
    fullName: $fullName
    position: $position
    role: $role
    salary: $salary
    department: $department
    email: $email
    contact: $contact
    startDate: $startDate
    status: $status
    attendance: $attendance
    salaryPaymentStatus: $salaryPaymentStatus
  })
  user_updateMany(
    where: {
      tenantId: { eq: $tenantId }
      businessId: { eq: $businessId }
      email: { eq: $currentEmail }
    }
    data: {
      email: $email
      role: $userRole
      fullName: $fullName
      department: $department
      phoneNumber: $contact
    }
  ) @check(expr: "this == 1", message: "Employee login profile is missing or duplicated")
}

mutation DeleteEmployeeWithAccess(
  $id: String!
  $tenantId: String!
  $businessId: String!
  $currentEmail: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    employee(id: $id) @check(expr: "this != null", message: "Employee not found") {
      tenantId @check(expr: "this == vars.tenantId", message: "Employee is outside this company")
      businessId @check(expr: "this == vars.businessId", message: "Employee is outside this company")
      email @check(expr: "this == vars.currentEmail", message: "Employee login binding changed")
    }
  }
  employee_delete(id: $id)
  user_deleteMany(where: {
    tenantId: { eq: $tenantId }
    businessId: { eq: $businessId }
    email: { eq: $currentEmail }
  }) @check(expr: "this == 1", message: "Employee login profile is missing or duplicated")
}

