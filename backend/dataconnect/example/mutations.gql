  $tenantId: String!, $businessId: String!, $entityType: String!,
  $operation: String!, $recordId: String!, $payload: Any!
) @auth(level: NO_ACCESS) {
  mirrorOutbox_insert(data: {
    tenantId: $tenantId, businessId: $businessId, entityType: $entityType,
    operation: $operation, recordId: $recordId, payload: $payload,
    status: "PENDING", attempts: 0,
    nextAttemptAt_expr: "request.time", createdAt_expr: "request.time"
  })
}

mutation UpdateMirrorOutbox(
  $id: String!, $status: String!, $attempts: Int!, $nextAttemptAt: Timestamp!,
  $lastError: String, $deliveredAt: Timestamp
) @auth(level: NO_ACCESS) {
  mirrorOutbox_update(id: $id, data: {
    status: $status, attempts: $attempts, nextAttemptAt: $nextAttemptAt,
    lastError: $lastError, deliveredAt: $deliveredAt
  })
}
