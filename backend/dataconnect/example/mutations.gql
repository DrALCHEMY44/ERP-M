# --- Atomic workspace bootstrap ---

mutation BootstrapWorkspace(
  $tenantId: String!
  $businessId: String!
  $userId: String!
  $name: String!
  $businessSector: String!
  $location: String!
  $region: String!
  $ownerEmail: String!
  $fullName: String!
  $code: String!
) @auth(level: NO_ACCESS) @transaction {
  tenant_insert(data: {
    id: $tenantId
    name: $name
    businessSector: $businessSector
    location: $location
    ownerEmail: $ownerEmail
    subscriptionTier: "Basic"
    status: "Active"
    createdAt_expr: "request.time"
  })
  business_insert(data: {
    id: $businessId
    tenantId: $tenantId
    name: $name
    location: $location
    businessType: $businessSector
    region: $region
    code: $code
    createdAt_expr: "request.time"
  })
  businessSetting_insert(data: {
    businessId: $businessId
    tenantId: $tenantId
    currency: "FCFA"
    timezone: "Africa/Douala"
    fiscalYearStart: "01-01"
    taxRate: 0
    lowStockThreshold: 10
    updatedAt_expr: "request.time"
  })
  user_insert(data: {
    id: $userId
    tenantId: $tenantId
    businessId: $businessId
    email: $ownerEmail
    role: "Business Owner"
    fullName: $fullName
    createdAt_expr: "request.time"
  })
}

